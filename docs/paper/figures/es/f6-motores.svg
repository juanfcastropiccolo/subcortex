width="129" height="12" rx="3" fill="var(--viz-neutral)"><title>Claude · baseline: 6</title></rect><text x="544" y="90" fill="currentColor" font-size="11">6</text><rect x="410" y="95" width="43" height="12" rx="3" fill="var(--viz-s1)"><title>Claude · subcortex: 2</title></rect><text x="458" y="105" fill="currentColor" font-size="11">2</text><text x="402" y="92" text-anchor="end" fill="var(--ink-2)" font-size="11">Claude</text><text x="620" y="20" fill="currentColor" font-weight="600">marketworld: score medio</text><line x1="770" y1="32" x2="770" y2="150" stroke="var(--line)"/><rect x="725" y="40" width="45" height="12" rx="3" fill="var(--viz-neutral)"><title>Gemini · baseline: -4.1</title></rect><text x="720" y="50" text-anchor="end" fill="currentColor" font-size="11">-4.1</text><rect x="770" y="55" width="92" height="12" rx="3" fill="var(--viz-s1)"><title>Gemini · subcortex: 8.4</title></rect><text x="867" y="65" text-anchor="start" fill="currentColor" font-size="11">8.4</text><text x="702" y="52" text-anchor="end" fill="var(--ink-2)" font-size="11">Gemini</text><rect x="770" y="80" width="19" height="12" rx="3" fill="var(--viz-neutral)"><title>Claude · baseline: 1.7</title></rect><text x="794" y="90" text-anchor="start" fill="currentColor" font-size="11">1.7</text><rect x="770" y="95" width="106" height="12" rx="3" fill="var(--viz-s1)"><title>Claude · subcortex: 9.6</title></rect><text x="881" y="105" text-anchor="start" fill="currentColor" font-size="11">9.6</text><text x="702" y="92" text-anchor="end" fill="var(--ink-2)" font-size="11">Claude</text><rect x="20" y="150" width="12" height="12" rx="3" fill="var(--viz-neutral)"/><text x="38" y="160" fill="var(--ink-2)">baseline</text><rect x="110" y="150" width="12" height="12" rx="3" fill="var(--viz-s1)"/><text x="128" y="160" fill="var(--ink-2)">subcortex</text></svg><figcaption>Figura 6. Mismos A/B con un segundo motor (Claude Sonnet 5, n=40 por brazo). En opsworld, contra un baseline más fuerte, la capa mantiene