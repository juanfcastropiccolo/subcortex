<figure><svg viewBox="0 0 930 320" role="img" aria-label="Diagrama del flujo de un turno: before_model con memoria, hábito e interocepción; LLM; after_model con winner-take-all; before_tool con validación y veto; herramienta; after_tool con aprendizaje." xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, sans-serif" font-size="12" style="max-width:100%;height:auto;color:var(--ink)"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker></defs><rect x="20" y="40" width="200" height="84" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="120.0" y="60" text-anchor="middle" fill="currentColor" font-weight="600">before_model</text><text x="120.0" y="76" text-anchor="middle" fill="var(--ink-2)" font-size="10.5">memoria: precedentes y reglas ·</text><text x="120.0" y="89" text-anchor="middle" fill="var(--ink-2)" font-size="10.5">hábito: ¿bypass? · interocepción:</text><text x="120.0" y="102" text-anchor="middle" fill="var(--ink-2)" font-size="10.5">estado</text><rect x="290" y="40" width="150" height="56" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="365.0" y="60" text-anchor="middle" fill="currentColor" font-weight="600">LLM</text><text x="365.0" y="76" text-anchor="middle" fill="var(--ink-2)" font-size="10.5">propone acción + predicción</text><rect x="510" y="40" width="170" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="595.0" y="60" text-anchor="middle" fill="currentColor" font-weight="600">after_model</text><text x="595.0" y="76" text-anchor="middle" fill="var(--ink-2)" font-size="10.5">gate: una sola acción</text><text x="595.0" y="89" text-anchor="middle" fill="var(--ink-2)" font-size="10.5">(winner-take-all)</text><line x1="220" y1="79" x2="288" y2="70" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)" /><line x1="440" y1="66" x2="508" y2="66" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)" /><line x1="120" y1="124" x2="120" y2="158" stroke="var(--viz-s1)" stroke-width="1.4" marker-end="url(#a)" /><text x="120.0" y="155.0" text-anchor="middle" fill="var(--ink-3)" font-size="11">hábito compilado</text><path d="M 120 158 C 120 195, 700 195, 750 132" fill="none" stroke="var(--viz-s1)" stroke-width="1.6" marker-end="url(#a)"/><text x="410" y="210" text-anchor="middle" fill="var(--viz-s1)" font-size="11">sin llamar al modelo</text><rect x="510" y="134" width="170" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="595.0" y="154" text-anchor="middle" fill="currentColor" font-weight="600">before_tool</text><text x="595.0" y="170" text-anchor="middle" fill="var(--ink-2)" font-size="10.5">predicción válida · veto por</text><text x="595.0" y="183" text-anchor="middle" fill="var(--ink-2)" font-size="10.5">defecto</text><line x1="595" y1="110" x2="595" y2="132" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)" /><rect x="750" y="66" width="150" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="825.0" y="86" text-anchor="middle" fill="currentColor" font-weight="600">herramienta</text><text x="825.0" y="102" text-anchor="middle" fill="var(--ink-2)" font-size="10.5">mundo real → observed_effect</text><line x1="680" y1="158" x2="748" y2="118" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)" /><text x="714.0" y="130.0" text-anchor="middle" fill="var(--ink-3)" font-size="11">autorizada</text><path d="M 510 176 C 390 176, 310 144, 306 98" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="368" y="155" text-anchor="middle" fill="var(--ink-3)" font-size="11">vetada / rechazada: el modelo re-itera</text><rect x="750" y="210" width="150" height="96" rx="6" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="825.0" y="230" text-anchor="middle" fill="currentColor" font-weight="600">after_tool</text><text x="825.0" y="246" text-anchor="middle" fill="var(--ink-2)" font-size="10.5">error de predicción → memoria</text><text x="825.0" y="259" text-anchor="middle" fill="var(--ink-2)" font-size="10.5">(sorpresa/éxito) → dopamina →</text><text x="825.0" y="272" text-anchor="middle" fill="var(--ink-2)" font-size="10.5">hábitos → tono</text><line x1="825" y1="136" x2="825" y2="208" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)" /><path d="M 750 262 C 300 272, 125 248, 117 128" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#a)"/><text x="390" y="252" text-anchor="middle" fill="var(--ink-3)" font-size="11">lo aprendido alimenta la próxima decisión</text></svg><figcaption>Figura 1. Un turno del bucle: los cinco plugins se cuelgan de los hooks del ciclo de tool-calls. Un veto no rompe el bucle (vuelve como resultado y el modelo re-itera); un hábito compilado ejecuta la acción sin invocar al modelo.</figcaption></figure>