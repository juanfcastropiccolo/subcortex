<figure><svg viewBox="0 0 920 310" role="img" aria-label="Diagrama del flujo de un turno: before_model con memoria, hábito e interocepción; LLM; after_model con winner-take-all; before_tool con validación y veto; herramienta; after_tool con aprendizaje." xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, sans-serif" font-size="12" style="max-width:100%;height:auto;color:var(--ink)"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker></defs><rect x="20" y="40" width="190" height="78" rx="6" fill="none" stroke="currentColor" stroke-width="1.4" /><text x="115.0" y="60" text-anchor="middle" fill="currentColor" font-weight="600">before_model</text><text x="115.0" y="76" text-anchor="middle" fill="var(--ink-2)" font-size="11">memoria: precedentes y reglas · hábito: ¿bypass? · interocepción: estado</text><rect x="280" y="40" width="150" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="1.4" /><text x="355.0" y="60" text-anchor="middle" fill="currentColor" font-weight="600">LLM</text><text x="355.0" y="76" text-anchor="middle" fill="var(--ink-2)" font-size="11">propone acción + predicción</text><rect x="500" y="40" width="170" height="66" rx="6" fill="none" stroke="currentColor" stroke-width="1.4" /><text x="585.0" y="60" text-anchor="middle" fill="currentColor" font-weight="600">after_model</text><text x="585.0" y="76" text-anchor="middle" fill="var(--ink-2)" font-size="11">gate: una sola acción (winner-take-all)</text><line x1="210" y1="79" x2="278" y2="70" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)" /><line x1="430" y1="66" x2="498" y2="66" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)" /><line x1="115" y1="118" x2="115" y2="156" stroke="var(--viz-s1)" stroke-width="1.4" marker-end="url(#a)" /><text x="115.0" y="151.0" text-anchor="middle" fill="var(--ink-3)" font-size="11">hábito compilado</text><path d="M 115 156 C 115 190, 690 190, 740 130" fill="none" stroke="var(--viz-s1)" stroke-width="1.6" marker-end="url(#a)"/><text x="400" y="205" text-anchor="middle" fill="var(--viz-s1)" font-size="11">sin llamar al modelo</text><rect x="500" y="130" width="170" height="66" rx="6" fill="none" stroke="currentColor" stroke-width="1.4" /><text x="585.0" y="150" text-anchor="middle" fill="currentColor" font-weight="600">before_tool</text><text x="585.0" y="166" text-anchor="middle" fill="var(--ink-2)" font-size="11">predicción válida · veto por defecto</text><line x1="585" y1="106" x2="585" y2="128" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)" /><rect x="740" y="80" width="150" height="66" rx="6" fill="none" stroke="currentColor" stroke-width="1.4" /><text x="815.0" y="100" text-anchor="middle" fill="currentColor" font-weight="600">herramienta</text><text x="815.0" y="116" text-anchor="middle" fill="var(--ink-2)" font-size="11">mundo real → observed_effect</text><line x1="670" y1="150" x2="738" y2="122" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)" /><text x="704.0" y="128.0" text-anchor="middle" fill="var(--ink-3)" font-size="11">autorizada</text><path d="M 500 170 C 380 170, 300 140, 296 94" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="360" y="150" text-anchor="middle" fill="var(--ink-3)" font-size="11">vetada / rechazada: el modelo re-itera</text><rect x="740" y="200" width="150" height="92" rx="6" fill="none" stroke="currentColor" stroke-width="1.4" /><text x="815.0" y="220" text-anchor="middle" fill="currentColor" font-weight="600">after_tool</text><text x="815.0" y="236" text-anchor="middle" fill="var(--ink-2)" font-size="11">error de predicción → memoria (sorpresa/éxito) → dopamina → hábitos → tono</text><line x1="815" y1="146" x2="815" y2="198" stroke="currentColor" stroke-width="1.4" marker-end="url(#a)" /><path d="M 740 250 C 300 260, 120 240, 112 122" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#a)"/><text x="380" y="242" text-anchor="middle" fill="var(--ink-3)" font-size="11">lo aprendido alimenta la próxima decisión</text></svg><figcaption>Figura 1. Un turno del bucle: los cinco plugins se cuelgan de los hooks del ciclo de tool-calls. Un veto no rompe el bucle (vuelve como resultado y el modelo re-itera); un hábito compilado ejecuta la acción sin invocar al modelo.</figcaption></figure>