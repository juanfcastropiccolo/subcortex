></circle><circle cx="451" cy="77" r="4" fill="none" stroke="var(--viz-s1)" stroke-width="1.6"><title>trajectory: 68.3</title></circle><circle cx="499" cy="77" r="4" fill="none" stroke="var(--viz-s1)" stroke-width="1.6"><title>trajectory: 83.2</title></circle><line x1="230" y1="152" x2="880" y2="152" stroke="var(--line)"/><text x="20" y="185" fill="currentColor" font-weight="600">Weekly variant · 120 decisions (7 d)</text><text x="222" y="213" text-anchor="end" fill="var(--ink-2)">baseline</text><rect x="230" y="200" width="295" height="18" rx="4" fill="var(--viz-neutral)"><title>baseline: 91.4</title></rect><text x="531" y="213" fill="currentColor" font-weight="600">91.4</text><text x="222" y="241" text-anchor="end" fill="var(--ink-2)">subcortex</text><rect x="230" y="228" width="328" height="18" rx="4" fill="var(--viz-s1)"><title>subcortex: 101.6</title></rect><text x="564" y="241" fill="currentColor" font-weight="600">101.6</text><text x="222" y="269" text-anchor="end" fill="var(--ink-2)">BTC buy & hold</text><rect x="230" y="256" width="308" height="18" rx="4" fill="var(--viz-ref)"><title>BTC buy & hold: 95.3</title></rect><text x="544" y="269" fill="currentColor" font-weight="600">95.3</text></svg><figcaption>Figure 3. marketworld: final equity per runner. Top: 40 decisions every 21 days (rings are the five subcortex trajectories; the baseline is deterministic). Bottom: the weekly variant, where subcortex also beats BTC.</figcaption></figure>