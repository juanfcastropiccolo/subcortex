<figure><svg viewBox="0 0 920 175" role="img" aria-label="Per-engine comparison: opsworld calls per episode, Gemini 6.7 to 5.0 and Claude 6.0 to 4.8; harmful actions, Gemini 4 to 2 and Claude 6 to 2; marketworld mean score, Gemini −4.1 to 8.4 and Claude 1.7 to 9.6." xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, sans-serif" font-size="12" style="max-width:100%;height:auto;color:var(--ink)"><text x="20" y="20" fill="currentColor" font-weight="600">opsworld: calls / episode</text><rect x="110" y="40" width="126" height="12" rx="3" fill="var(--viz-neutral)"><title>Gemini · baseline: 6.7</title></rect><text x="241" y="50" fill="currentColor" font-size="11">6.7</text><rect x="110" y="55" width="94" height="12" rx="3" fill="var(--viz-s1)"><title>Gemini · subcortex: 5.0</title></rect><text x="209" y="65" fill="currentColor" font-size="11">5.0</text><text x="102" y="52" text-anchor="end" fill="var(--ink-2)" font-size="11">Gemini</text><rect x="110" y="80" width="112" height="12" rx="3" fill="var(--viz-neutral)"><title>Claude · baseline: 6.0</title></rect><text x="227" y="90" fill="currentColor" font-size="11">6.0</text><rect x="110" y="95" width="90" height="12" rx="3" fill="var(--viz-s1)"><title>Claude · subcortex: 4.8</title></rect><text x="205" y="105" fill="currentColor" font-size="11">4.8</text><text x="102" y="92" text-anchor="end" fill="var(--ink-2)" font-size="11">Claude</text><text x="320" y="20" fill="currentColor" font-weight="600">opsworld: harmful actions</text><rect x="410" y="40" width="86" height="12" rx="3" fill="var(--viz-neutral)"><title>Gemini · baseline: 4</title></rect><text x="501" y="50" fill="currentColor" font-size="11">4</text><rect x="410" y="55" width="43" height="12" rx="3" fill="var(--viz-s1)"><title>Gemini · subcortex: 2</title></rect><text x="458" y="65" fill="currentColor" font-size="11">2</text><text x="402" y="52" text-anchor="end" fill="var(--ink-2)" font-size="11">Gemini</text><rect x="410" y="80" width="129" height="12" rx="3" fill="var(--viz-neutral)"><title>Claude · baseline: 6</title></rect><text x="544" y="90" fill="currentColor" font-size="11">6</text><rect x="410" y="95" width="43" height="12" rx="3" fill="var(--viz-s1)"><title>Claude · subcortex: 2</title></rect><text x="458" y="105" fill="currentColor" font-size="11">2</text><text x="402" y="92" text-anchor="end" fill="var(--ink-2)" font-size="11">Claude</text><text x="620" y="20" fill="currentColor" font-weight="600">marketworld: mean score</text><line x1="770" y1="32" x2="770" y2="150" stroke="var(--line)"/><rect x="725" y="40" width="45" height="12" rx="3" fill="var(--viz-neutral)"><title>Gemini · baseline: -4.1</title></rect><text x="720" y="50" text-anchor="end" fill="currentColor" font-size="11">-4.1</text><rect x="770" y="55" width="92" height="12" rx="3" fill="var(--viz-s1)"><title>Gemini · subcortex: 8.4</title></rect><text x="867" y="65" text-anchor="start" fill="currentColor" font-size="11">8.4</text><text x="702" y="52" text-anchor="end" fill="var(--ink-2)" font-size="11">Gemini</text><rect x="770" y="80" width="19" height="12" rx="3" fill="var(--viz-neutral)"><title>Claude · baseline: 1.7</title></rect><text x="794" y="90" text-anchor="start" fill="currentColor" font-size="11">1.7</text><rect x="770" y="95" width="106" height="12" rx="3" fill="var(--viz-s1)"><title>Claude · subcortex: 9.6</title></rect><text x="881" y="105" text-anchor="start" fill="currentColor" font-size="11">9.6</text><text x="702" y="92" text-anchor="end" fill="var(--ink-2)" font-size="11">Claude</text><rect x="20" y="150" width="12" height="12" rx="3" fill="var(--viz-neutral)"/><text x="38" y="160" fill="var(--ink-2)">baseline</text><rect x="110" y="150" width="12" height="12" rx="3" fill="var(--viz-s1)"/><text x="128" y="160" fill="var(--ink-2)">subcortex</text></svg><figcaption>Figure 6. Same A/Bs on a second engine (Claude Sonnet 5, n=40 per arm). In opsworld, against a stronger baseline, the layer keeps the call reduction and cuts harmful actions to a third; in marketworld the direction reproduces: subcortex above the baseline on both engines (Gemini: mean of five trajectories).</figcaption></figure>