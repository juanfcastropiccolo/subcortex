<figure><svg viewBox="0 0 920 175" role="img" aria-label="Per-engine comparison: opsworld calls per episode, Gemini 3 Flash 6.7 to 5.0 and Claude Sonnet 5 6.0 to 4.8; harmful actions, Gemini 3 Flash 4 to 2 and Claude Sonnet 5 6 to 2; marketworld mean score, Gemini 3 Flash −4.1 to 8.4 and Claude Sonnet 5 1.7 to 9.6." xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, sans-serif" font-size="12" style="max-width:100%;height:auto;color:var(--ink)"><text x="20" y="20" fill="currentColor" font-weight="600">opsworld: calls / episode</text><rect x="128" y="40" width="117" height="12" rx="3" fill="var(--viz-neutral)"><title>Gemini 3 Flash · baseline: 6.7</title></rect><text x="250" y="50" fill="currentColor" font-size="11">6.7</text><rect x="128" y="55" width="88" height="12" rx="3" fill="var(--viz-s1)"><title>Gemini 3 Flash · subcortex: 5.0</title></rect><text x="221" y="65" fill="currentColor" font-size="11">5.0</text><text x="122" y="52" text-anchor="end" fill="var(--ink-2)" font-size="10">Gemini 3 Flash</text><rect x="128" y="80" width="105" height="12" rx="3" fill="var(--viz-neutral)"><title>Claude Sonnet 5 · baseline: 6.0</title></rect><text x="238" y="90" fill="currentColor" font-size="11">6.0</text><rect x="128" y="95" width="84" height="12" rx="3" fill="var(--viz-s1)"><title>Claude Sonnet 5 · subcortex: 4.8</title></rect><text x="217" y="105" fill="currentColor" font-size="11">4.8</text><text x="122" y="92" text-anchor="end" fill="var(--ink-2)" font-size="10">Claude Sonnet 5</text><text x="320" y="20" fill="currentColor" font-weight="600">opsworld: harmful actions</text><rect x="428" y="40" width="80" height="12" rx="3" fill="var(--viz-neutral)"><title>Gemini 3 Flash · baseline: 4</title></rect><text x="513" y="50" fill="currentColor" font-size="11">4</text><rect x="428" y="55" width="40" height="12" rx="3" fill="var(--viz-s1)"><title>Gemini 3 Flash · subcortex: 2</title></rect><text x="473" y="65" fill="currentColor" font-size="11">2</text><text x="422" y="52" text-anchor="end" fill="var(--ink-2)" font-size="10">Gemini 3 Flash</text><rect x="428" y="80" width="120" height="12" rx="3" fill="var(--viz-neutral)"><title>Claude Sonnet 5 · baseline: 6</title></rect><text x="553" y="90" fill="currentColor" font-size="11">6</text><rect x="428" y="95" width="40" height="12" rx="3" fill="var(--viz-s1)"><title>Claude Sonnet 5 · subcortex: 2</title></rect><text x="473" y="105" fill="currentColor" font-size="11">2</text><text x="422" y="92" text-anchor="end" fill="var(--ink-2)" font-size="10">Claude Sonnet 5</text><text x="620" y="20" fill="currentColor" font-weight="600">marketworld: mean score</text><line x1="772" y1="32" x2="772" y2="150" stroke="var(--line)"/><rect x="731" y="40" width="41" height="12" rx="3" fill="var(--viz-neutral)"><title>Gemini 3 Flash · baseline: -4.1</title></rect><text x="726" y="50" text-anchor="end" fill="currentColor" font-size="11">-4.1</text><rect x="772" y="55" width="84" height="12" rx="3" fill="var(--viz-s1)"><title>Gemini 3 Flash · subcortex: 8.4</title></rect><text x="861" y="65" text-anchor="start" fill="currentColor" font-size="11">8.4</text><text x="722" y="52" text-anchor="end" fill="var(--ink-2)" font-size="10">Gemini 3 Flash</text><rect x="772" y="80" width="17" height="12" rx="3" fill="var(--viz-neutral)"><title>Claude Sonnet 5 · baseline: 1.7</title></rect><text x="794" y="90" text-anchor="start" fill="currentColor" font-size="11">1.7</text><rect x="772" y="95" width="96" height="12" rx="3" fill="var(--viz-s1)"><title>Claude Sonnet 5 · subcortex: 9.6</title></rect><text x="873" y="105" text-anchor="start" fill="currentColor" font-size="11">9.6</text><text x="722" y="92" text-anchor="end" fill="var(--ink-2)" font-size="10">Claude Sonnet 5</text><rect x="20" y="150" width="12" height="12" rx="3" fill="var(--viz-neutral)"/><text x="38" y="160" fill="var(--ink-2)">baseline</text><rect x="110" y="150" width="12" height="12" rx="3" fill="var(--viz-s1)"/><text x="128" y="160" fill="var(--ink-2)">subcortex</text></svg><figcaption>Figure 6. Same A/Bs on a second engine (Claude Sonnet 5, n=40 per arm). In opsworld, against a stronger baseline, the layer keeps the call reduction and cuts harmful actions to a third; in marketworld the direction reproduces: subcortex above the baseline on both engines (Gemini 3 Flash: mean of five trajectories).</figcaption></figure>