[project]
name = "subcortex"
version = "0.1.0"
description = "Capa subcortical para agentes ADK: gate, predicción, interocepción, memoria episódica y hábitos"
requires-python = ">=3.11"
dependencies = [
    # Cota superior pedida por la auditoría: sin ella, un ADK 3.x cambia los hooks de plugins
    # y la reproducción exacta de las corridas deja de estar garantizada (uv.lock fija el resto).
    "google-adk>=1.20,<3",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["bugworld/vendor"]  # código ajeno: es el objetivo del experimento, no se toca

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF012"]  # modelos pydantic en el LLM falso

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subcortex", "opsworld"]
